workflows:
  capacitor-full:
    name: Android + iOS Build
    max_build_duration: 60

    environment:
      node: 18
      xcode: latest
      cocoapods: default
      
    android_signing:
      - keystore_reference

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Build web app
        script: npm run build

      - name: Sync Capacitor
        script: |
          npx cap sync

      # ANDROID
      - name: Build Android
        script: |
          cd android
          ./gradlew assembleRelease

      # IOS
      - name: Build iOS
        script: |
          cd ios
          pod install
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            archive \
            -archivePath build/App.xcarchive

    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
      - ios/build/**/*.ipa
